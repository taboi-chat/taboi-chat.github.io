<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Taboi - chat v2</title>

<link rel="icon" href="files/icon/favicon.ico">



<style>

:root{

--orange:#ff7a00;

--orange-2:#ff8f26;

--card:#17181b;

--text:#eaeaea;

--muted:#a8a8a8;

--mine:#23252a;

}



*{box-sizing:border-box}



body{

margin:0;

background:#0b0b0b;

font-family:system-ui;

color:var(--text);

height:100vh;

display:grid;

place-items:center;

}



/* ===== USER SELECT ===== */

.user-select{

position:fixed;

inset:0;

background:#0f0f10;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:18px;

z-index:300;

}



.user-select button{

padding:14px 26px;

border:0;

border-radius:12px;

font-size:16px;

cursor:pointer;

font-weight:700;

background:linear-gradient(90deg,var(--orange),var(--orange-2));

}



/* ===== APP ===== */

.app{

width:min(900px,100%);

height:min(780px,100vh);

display:flex;

flex-direction:column;

background:var(--card);

border-radius:18px;

overflow:hidden;

opacity:0;

transition:.4s;

}

.app.visible{opacity:1}



/* ===== HEADER (CORRIGIDO) ===== */

.top{

display:flex;

align-items:center;

gap:10px;

padding:6px 12px;

height:48px;

background:linear-gradient(90deg,var(--orange),var(--orange-2));

color:#111;

}



.top h1{

margin:0;

font-size:16px;

line-height:1;

}



.logo img{

width:28px;

height:28px;

object-fit:contain;

}



/* ===== FEED ===== */

.feed{

flex:1;

overflow:auto;

padding:14px;

background:#15161a;

}



.msg{

display:flex;

gap:10px;

margin:6px 0;

max-width:78%;

}



.msg.me{

margin-left:auto;

flex-direction:row-reverse;

}



.avatar{

min-width:34px;

height:34px;

border-radius:50%;

background:#2b2d33;

display:grid;

place-items:center;

font-weight:700;

}



.bubble{

background:var(--mine);

padding:10px 12px;

border-radius:16px;

box-shadow:0 3px 10px #0006;

white-space:pre-wrap;

overflow-wrap:anywhere;

word-break:break-word;

}



.bubble a{

color:#ffae5d;

text-decoration:underline;

}



.meta{

font-size:11px;

color:var(--muted);

margin-top:4px;

}



/* ===== INPUT ===== */

.input{

display:flex;

gap:6px;

padding:10px;

background:#101114;

position:relative;

}



textarea{

flex:1;

height:44px;

border-radius:10px;

border:1px solid #2a2c32;

background:#15171c;

color:#fff;

padding:10px;

resize:none;

}



button{

border:0;

border-radius:10px;

cursor:pointer;

}



.send{

background:linear-gradient(90deg,var(--orange),var(--orange-2));

font-weight:700;

padding:0 14px;

}



.tool{

width:40px;

background:#1f2126;

color:#fff;

}



/* ===== EMOJIS ===== */

.emoji-panel{

position:absolute;

bottom:70px;

left:10px;

background:#1c1e22;

padding:10px;

border-radius:12px;

display:none;

flex-direction:column;

gap:8px;

width:220px;

box-shadow:0 10px 20px #0008;

}



.emoji-grid{

display:flex;

flex-wrap:wrap;

gap:6px;

}



.emoji-category{

font-size:12px;

color:#aaa;

margin:6px 0 2px;

}



.emoji-panel span{

cursor:pointer;

font-size:20px;

}



.emoji-close{

background:#2a2c32;

color:#fff;

padding:6px;

}



@media(max-width:560px){

.avatar{display:none}

.msg{max-width:90%}

}

/* ===== SCROLLBAR PERSONALIZADA (LARANJA) ===== */



/* Chrome, Edge, Opera */

::-webkit-scrollbar{

width:10px;

height:10px;

}



::-webkit-scrollbar-track{

background:#101114;

border-radius:10px;

}



::-webkit-scrollbar-thumb{

background:linear-gradient(

180deg,

var(--orange),

var(--orange-2)

);

border-radius:10px;

border:2px solid #101114;

}



::-webkit-scrollbar-thumb:hover{

background:linear-gradient(

180deg,

#ff8f26,

#ffa347

);

}



/* Firefox */

*{

scrollbar-width:thin;

scrollbar-color: var(--orange) #101114;

}

.emoji-panel{

position:absolute;

bottom:70px;

left:10px;

background:#1c1e22;

padding:10px;

border-radius:12px;

display:none;

flex-direction:column;

gap:8px;

width:240px;



max-height:260px; /* limite de altura */

overflow-y:auto; /* scroll vertical */



box-shadow:0 10px 20px #0008;

}

</style>

</head>



<body>



<!-- SELEÇÃO -->

<div class="user-select" id="userSelect">

<h2>Quem é você?</h2>

<button onclick="chooseUser('Vicente')">Vicente</button>

<button onclick="chooseUser('Francisco')">Francisco</button>

<button onclick="chooseUser('Mariana')">Mariana</button>

</div>



<div class="app" id="app">



<div class="top">

<div class="logo">

<img src="files/icon/Tfavicon.png">

</div>

<h1>taboi - chat</h1>

</div>



<div id="feed" class="feed"></div>



<div class="input">

<button class="tool" id="emojiBtn">😀</button>

<button class="tool" id="linkBtn">🔗</button>

<textarea id="text" placeholder="mensagem"></textarea>

<button class="send" id="sendBtn">Enviar</button>



<div class="emoji-panel" id="emojiPanel">

<div class="emoji-grid" id="emojiGrid"></div>

</div>

</div>



</div>



<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import{getFirestore,collection,addDoc,serverTimestamp,query,orderBy,onSnapshot,limit}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";



/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyD6qPIIX4i8n0e7mm31y2D2Pb1B26NogGM",

authDomain: "taboi-v2.firebaseapp.com",

projectId: "taboi-v2",

storageBucket: "taboi-v2.firebasestorage.app",

messagingSenderId: "774936620311",

appId: "1:774936620311:web:f6440002476c7cd9c2db52"

};



const appFB=initializeApp(firebaseConfig);

const db=getFirestore(appFB);

const MESSAGES=collection(db,"taboi_messages");



/* ELEMENTOS */

const feed=document.getElementById("feed");

const text=document.getElementById("text");



/* USER */

function getUser(){

return localStorage.getItem("taboi_user")||"";

}



window.chooseUser=(u)=>{

localStorage.setItem("taboi_user",u);

document.getElementById("userSelect").style.display="none";

document.getElementById("app").classList.add("visible");

};



if(getUser()){

document.getElementById("userSelect").style.display="none";

document.getElementById("app").classList.add("visible");

}



const emojiCategories = {

"😀 Carinhas": ["😀","😂","😎","😍","🥶","😱","😡","😭","😄","😁","😆","😅","🤣","😊"],



"👏 Gestos": ["👍","👏","❤️","👊","✌️","🤘","🤙","👌","🤝"],



"🎉 Objetos": ["🔥","⭐","✨","🎉","🎁","🎈","🎂","💣","💬"],



"🐶 Animais": ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐸","🐵"],



"🌍 Natureza": ["🌍","🌙","☀️","🌧️","⛈️","❄️","🌈","🌊"],



"🚗 Transporte": ["🚗","🚕","🚌","✈️","🚀","🚁"],



"💻 Tech": ["💻","📱","⌨️","🖥️","🖱️","📷","🎥","🔋","🎮"]

};



const emojiPanel=document.getElementById("emojiPanel");

const emojiGrid=document.getElementById("emojiGrid");



emojiGrid.innerHTML = "";



Object.entries(emojiCategories).forEach(([category, list]) => {



const title = document.createElement("div");

title.className = "emoji-category";

title.textContent = category;



emojiGrid.appendChild(title);



const group = document.createElement("div");

group.className = "emoji-grid";



list.forEach(e => {

const s = document.createElement("span");

s.textContent = e;

s.onclick = () => {

text.value += e;

text.focus();

};

group.appendChild(s);

});



emojiGrid.appendChild(group);

});



emojiBtn.onclick = () => {

emojiPanel.style.display =

emojiPanel.style.display === "flex" ? "none" : "flex";

};

/* LINK */

linkBtn.onclick=()=>{

const url=prompt("Cole o link:");

if(url) text.value+=` ${url} `;

};



/* ENVIAR */

sendBtn.onclick=send;



async function send(){

const user=getUser();

if(!user)return alert("Selecione um usuário");



const body=text.value.trim();

if(!body)return;



text.value="";

text.focus();



await addDoc(MESSAGES,{

body,

user,

ts:serverTimestamp()

});



// 👇 fecha o painel

emojiPanel.style.display = "none";

}



/* ENTER ENVIA */

text.addEventListener("keydown",(e)=>{

if(e.key==="Enter"&&!e.shiftKey){

e.preventDefault();

send();

}

});



/* LINK CLICKAVEL */

function linkify(t){

return t.replace(/(https?:\/\/[^\s]+)/g,

'<a href="$1" target="_blank">$1</a>');

}



/* LISTENER */

const q=query(MESSAGES,orderBy("ts","asc"),limit(200));



onSnapshot(q,(snap)=>{

feed.innerHTML="";

snap.forEach(doc=>{

const m=doc.data();

feed.appendChild(messageEl(m));

});

feed.scrollTop=feed.scrollHeight;

});



function messageEl(m){

const mine=m.user===getUser();



const wrap=document.createElement("div");

wrap.className="msg"+(mine?" me":"");



const av=document.createElement("div");

av.className="avatar";

av.textContent=m.user[0];



const right=document.createElement("div");



const bubble=document.createElement("div");

bubble.className="bubble";

bubble.innerHTML=linkify(m.body);



const meta=document.createElement("div");

meta.className="meta";

meta.textContent=m.user;



right.appendChild(bubble);

right.appendChild(meta);



wrap.appendChild(av);

wrap.appendChild(right);



return wrap;

}

document.addEventListener("click", (e) => {



const isClickInside =

emojiPanel.contains(e.target) ||

emojiBtn.contains(e.target);



if (!isClickInside) {

emojiPanel.style.display = "none";

}



});

</script>

<script>
// SISTEMA DE ALERTA DE VERSÃO DESATUALIZADA
(function() {
    // CONFIGURAÇÃO DAS VERSÕES
    const versions = [
        { file: "v1.html", version: "v1.0", name: "Taboi-Chat v1", latest: false },
        { file: "v2.html", version: "v2.0", name: "Taboi-Chat v2", latest: false },
        { file: "v2.6.html", version: "v2.6", name: "Taboi-Chat v2.6", latest: false },
        { file: "v3.html", version: "v3.0", name: "Taboi-Chat v3", latest: true }
    ];
    
    const currentFile = window.location.pathname.split('/').pop();
    const currentVersion = versions.find(v => v.file === currentFile);
    const latestVersion = versions.find(v => v.latest === true);
    
    // Se NÃO é a versão mais recente
    if (currentVersion && latestVersion && currentFile !== latestVersion.file) {
        const notified = localStorage.getItem('taboi_version_notified');
        
        if (notified !== latestVersion.version) {
            // Esperar a página carregar
            window.addEventListener('load', function() {
                setTimeout(function() {
                    // Criar modal
                    const modal = document.createElement('div');
                    modal.style.cssText = `
                        position: fixed;
                        inset: 0;
                        background: rgba(0,0,0,0.9);
                        backdrop-filter: blur(10px);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        z-index: 999999;
                        animation: fadeInVersao 0.3s ease-out;
                    `;
                    
                    modal.innerHTML = `
                        <div style="background: linear-gradient(135deg, #1a1c22, #131518); border-radius: 28px; padding: 32px; max-width: 480px; width: 90%; border: 1px solid rgba(255,122,0,0.3); animation: slideUpVersao 0.4s ease-out;">
                            <div style="text-align: center; font-size: 54px; margin-bottom: 16px;">🎉</div>
                            <h2 style="background: linear-gradient(90deg,#ff7a00,#ff8f26); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 28px; text-align: center; margin: 0 0 8px 0;">Atualização Disponível!</h2>
                            <p style="text-align: center; color: #ff7a00; font-size: 13px; margin-bottom: 24px;">Nova versão do Taboi-Chat</p>
                            
                            <div style="background: rgba(244,67,54,0.1); border: 1px solid #f44336; border-radius: 16px; padding: 14px; margin-bottom: 16px; text-align: center;">
                                📌 Versão atual: <span style="color: #ff8888; font-weight: bold;">${currentVersion.version}</span> - ${currentVersion.name}
                            </div>
                            
                            <div style="background: rgba(76,175,80,0.1); border: 1px solid #4caf50; border-radius: 16px; padding: 14px; margin-bottom: 20px; text-align: center;">
                                🎯 Nova versão: <span style="color: #81c784; font-weight: bold; font-size: 18px;">${latestVersion.version}</span> - ${latestVersion.name}
                            </div>
                            
                            <div style="background: #0b0d10; border-radius: 16px; padding: 16px; margin-bottom: 24px; color: #aaa; font-size: 14px; line-height: 1.6;">
                                <strong style="color: #ff7a00;">✨ Novidades da versão ${latestVersion.version}:</strong><br><br>
                                • Sistema de login com códigos de acesso<br>
                                • Modais estilizados e animados<br>
                                • Interface glassmorphism renovada<br>
                                • Sistema de banimento de usuários<br>
                                • Melhorias de performance
                            </div>
                            
                            <div style="display: flex; gap: 12px; justify-content: center;">
                                <button id="stayBtn" style="background: #2a2c32; color: #fff; padding: 12px 28px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer;">🔒 Continuar nesta versão</button>
                                <button id="updateBtn" style="background: linear-gradient(90deg,#ff7a00,#ff8f26); color: #111; padding: 12px 28px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer;">🚀 Atualizar agora</button>
                            </div>
                            <button id="closeModalBtn" style="position: absolute; top: 20px; right: 24px; background: none; border: none; color: #666; font-size: 28px; cursor: pointer;">✕</button>
                        </div>
                    `;
                    
                    document.body.appendChild(modal);
                    
                    // Animações
                    const style = document.createElement('style');
                    style.textContent = `
                        @keyframes fadeInVersao { from { opacity: 0; } to { opacity: 1; } }
                        @keyframes slideUpVersao { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
                    `;
                    document.head.appendChild(style);
                    
                    const closeModal = () => {
                        modal.style.animation = 'fadeInVersao 0.3s ease-out reverse';
                        setTimeout(() => modal.remove(), 300);
                        localStorage.setItem('taboi_version_notified', latestVersion.version);
                    };
                    
                    document.getElementById('closeModalBtn').onclick = closeModal;
                    document.getElementById('stayBtn').onclick = closeModal;
                    document.getElementById('updateBtn').onclick = () => {
                        localStorage.setItem('taboi_version_notified', latestVersion.version);
                        window.location.href = latestVersion.file;
                    };
                    
                    modal.onclick = (e) => {
                        if (e.target === modal) closeModal();
                    };
                }, 1000);
            });
        } else {
            // Já foi notificado, mostra apenas um toast
            window.addEventListener('load', function() {
                setTimeout(function() {
                    const toast = document.createElement('div');
                    toast.textContent = `✨ Nova versão ${latestVersion.version} disponível! Clique para atualizar.`;
                    toast.style.cssText = `
                        position: fixed;
                        bottom: 30px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: linear-gradient(135deg,#ff7a00,#ff8f26);
                        color: #111;
                        padding: 14px 28px;
                        border-radius: 50px;
                        font-weight: bold;
                        z-index: 99999;
                        cursor: pointer;
                        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
                        animation: slideInToast 0.3s ease-out;
                    `;
                    
                    const style = document.createElement('style');
                    style.textContent = `
                        @keyframes slideInToast {
                            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
                            to { transform: translateX(-50%) translateY(0); opacity: 1; }
                        }
                    `;
                    document.head.appendChild(style);
                    
                    toast.onclick = () => {
                        window.location.href = latestVersion.file;
                    };
                    
                    document.body.appendChild(toast);
                    
                    setTimeout(() => {
                        if (toast.parentNode) toast.remove();
                    }, 8000);
                }, 1500);
            });
        }
    }
})();
</script>

</body>

</html>
