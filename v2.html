<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chat</title>

<link rel="icon" href="files/icon/favicon.ico">

<style>
:root{
--orange:#ff7a00;
--orange-2:#ff8f26;
--bg:#0f0f10;
--card:#17181b;
--text:#eaeaea;
--mine:#23252a;
}

*{box-sizing:border-box}

body{
margin:0;
background:#0b0b0b;
font-family:system-ui;
color:var(--text);
height:100vh;
display:grid;
place-items:center;
}

/* APP */
.app{
width:min(900px,100%);
height:min(780px,100vh);
display:flex;
flex-direction:column;
background:var(--card);
border-radius:18px;
overflow:hidden;
opacity:0;
transition:.4s;
}

.app.visible{opacity:1}

/* TOP */
.top{
display:flex;
align-items:center;
gap:12px;
padding:12px;
background:linear-gradient(90deg,var(--orange),var(--orange-2));
color:#111;
}

.logo{
width:34px;
height:34px;
border-radius:8px;
background:#0002;
display:grid;
place-items:center;
}

.logo img{
width:26px;
height:26px;
}

/* FEED */
.feed{
flex:1;
overflow:auto;
padding:12px;
}

.msg{
display:flex;
gap:10px;
margin:6px 0;
max-width:75%;
}

.msg.me{
margin-left:auto;
flex-direction:row-reverse;
}

.avatar{
min-width:34px;
height:34px;
border-radius:50%;
background:#2b2d33;
display:grid;
place-items:center;
font-weight:700;
}

.bubble{
background:var(--mine);
padding:10px;
border-radius:14px;
white-space:pre-wrap;
word-break:break-word;
overflow-wrap:anywhere;
max-width:100%;
}

.msg img.emoji-img{
width:22px;
height:22px;
vertical-align:middle;
}

/* INPUT */
.input{
display:flex;
gap:6px;
padding:10px;
background:#101114;
}

textarea{
flex:1;
resize:none;
height:44px;
border-radius:10px;
background:#15171c;
color:#fff;
border:1px solid #333;
padding:10px;
}

button{
border:0;
border-radius:10px;
cursor:pointer;
}

.send{
background:linear-gradient(90deg,var(--orange),var(--orange-2));
font-weight:700;
padding:0 16px;
}

/* emoji panel */
.emojiPanel{
position:absolute;
bottom:80px;
right:20px;
background:#1b1c20;
border-radius:12px;
padding:10px;
display:none;
max-height:260px;
overflow:auto;
}

.emojiPanel img{
width:32px;
cursor:pointer;
margin:4px;
}

.emojiPanel span{
cursor:pointer;
padding:4px;
display:inline-block;
}

/* splash */
.splash{
position:fixed;
inset:0;
background:#0f0f10;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:20px;
}

.progress{
width:220px;
height:8px;
background:#222;
border-radius:6px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,var(--orange),var(--orange-2));
transition:.15s;
}

/* modal */
.modal{
position:fixed;
inset:0;
background:#000c;
display:flex;
align-items:center;
justify-content:center;
}

.modal-content{
background:#1d1f23;
padding:20px;
border-radius:10px;
display:flex;
flex-direction:column;
gap:10px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div class="splash" id="splash">
<h2>taboi - chat</h2>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
<div class="modal-content">
<h3>Login</h3>
<input id="loginID" placeholder="ID da conta">
<button id="loginBtn">Entrar</button>
<div id="loginError"></div>
</div>
</div>

<div class="app" id="app">

<div class="top">
<div class="logo">
<img src="files/icon/Tfavicon.png">
</div>
<h3>taboi - chat</h3>
</div>

<div id="feed" class="feed"></div>

<div class="input">
<button id="emojiBtn">😊</button>
<button id="kaomojiBtn">(＾▽＾)</button>
<textarea id="text"></textarea>
<button class="send" id="send">Enviar</button>
</div>

</div>

<div class="emojiPanel" id="emojiPanel"></div>

<script type="module">

/* ---------- LOGIN JSON ---------- */

let accounts=[];

async function loadAccounts(){
const res=await fetch("v2accounts.json");
const data=await res.json();
accounts=data.accounts;
}

function getUser(){
return localStorage.getItem("taboi_user");
}

function setUser(u){
localStorage.setItem("taboi_user",u);
}

/* ---------- SPLASH FAST ---------- */

const bar=document.getElementById("bar");
let p=0;

function fastSplash(done){
const i=setInterval(()=>{
p+=8+Math.random()*10; // MAIS RÁPIDO
bar.style.width=p+"%";
if(p>=100){
clearInterval(i);
setTimeout(done,200);
}
},80);
}

/* ---------- LOGIN ---------- */

await loadAccounts();

const loginModal=document.getElementById("loginModal");
const loginBtn=document.getElementById("loginBtn");

loginBtn.onclick=()=>{
const id=document.getElementById("loginID").value.trim();

const acc=accounts.find(a=>a.id===id);

if(!acc){
document.getElementById("loginError").textContent="ID inválido";
return;
}

setUser(acc.name);
loginModal.style.display="none";
document.getElementById("app").classList.add("visible");
};

/* ---------- EMOJIS ---------- */

const emojiPanel=document.getElementById("emojiPanel");
const text=document.getElementById("text");

document.getElementById("emojiBtn").onclick=()=>{
emojiPanel.style.display="block";
emojiPanel.innerHTML="";

for(let i=1;i<=30;i++){
const img=document.createElement("img");
img.src=`files/emo/${i}.png`;
img.onclick=()=> insertText(` [emo:${i}] `);
emojiPanel.appendChild(img);
}
};

document.getElementById("kaomojiBtn").onclick=()=>{
emojiPanel.style.display="block";

const kaos=[
"(＾▽＾)",
"(╯°□°）╯",
"(｡♥‿♥｡)",
"(¬‿¬)",
"(ಥ﹏ಥ)",
"(づ｡◕‿‿◕｡)づ"
];

emojiPanel.innerHTML="";
kaos.forEach(k=>{
const s=document.createElement("span");
s.textContent=k;
s.onclick=()=>insertText(" "+k+" ");
emojiPanel.appendChild(s);
});
};

function insertText(t){
text.value+=t;
text.focus();
}

/* ---------- CHAT LOCAL DEMO ---------- */

const feed=document.getElementById("feed");

document.getElementById("send").onclick=()=>{
const body=text.value.trim();
if(!body)return;

addMessage(getUser(),body);
text.value="";
};

function addMessage(user,body){

const div=document.createElement("div");
div.className="msg me";

body=body.replace(/\[emo:(\d+)\]/g,
(_,n)=>`<img class="emoji-img" src="files/emo/${n}.png">`
);

div.innerHTML=`
<div class="avatar">${user[0]}</div>
<div class="bubble">${body}</div>
`;

feed.appendChild(div);
feed.scrollTop=feed.scrollHeight;
}

/* ---------- START ---------- */

fastSplash(()=>{
document.getElementById("splash").style.display="none";

if(getUser()){
document.getElementById("app").classList.add("visible");
loginModal.style.display="none";
}
});

</script>

</body>
</html>
