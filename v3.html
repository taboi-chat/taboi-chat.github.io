<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taboi - chat v3</title>
<link rel="icon" href="files/icon/favicon.ico">

<style>
:root{
 --orange:#ff7a00;
 --orange-2:#ff8f26;
 --card:#17181b;
 --text:#eaeaea;
 --muted:#a8a8a8;
 --mine:#23252a;
 --error:#f44336;
 --success:#4caf50;
}

*{box-sizing:border-box}

body{
 margin:0;
 background:#0b0b0b;
 font-family:system-ui;
 color:var(--text);
 height:100vh;
 display:grid;
 place-items:center;
}

/* ===== MODAL GENERICO ===== */
.modal-overlay{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.8);
 backdrop-filter:blur(8px);
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:1000;
 animation:fadeIn 0.3s ease-out;
}

.modal{
 background:linear-gradient(135deg, #1a1c22, #131518);
 border-radius:24px;
 padding:32px;
 max-width:420px;
 width:90%;
 box-shadow:0 20px 40px rgba(0,0,0,0.5);
 border:1px solid rgba(255,122,0,0.2);
 animation:slideUp 0.3s ease-out;
}

.modal h2{
 margin:0 0 12px 0;
 background:linear-gradient(90deg,var(--orange),var(--orange-2));
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
 font-size:28px;
}

.modal p{
 color:var(--muted);
 margin-bottom:24px;
 line-height:1.5;
}

.modal-input{
 width:100%;
 padding:14px;
 background:#0b0d10;
 border:2px solid #2a2c32;
 border-radius:12px;
 color:var(--text);
 font-size:16px;
 margin-bottom:20px;
 transition:border-color 0.2s;
}

.modal-input:focus{
 outline:none;
 border-color:var(--orange);
}

.modal-buttons{
 display:flex;
 gap:12px;
 justify-content:flex-end;
}

.modal-btn{
 padding:10px 24px;
 border:none;
 border-radius:10px;
 font-weight:600;
 cursor:pointer;
 transition:transform 0.1s;
}

.modal-btn-primary{
 background:linear-gradient(90deg,var(--orange),var(--orange-2));
 color:#111;
}

.modal-btn-secondary{
 background:#2a2c32;
 color:var(--text);
}

.modal-btn:hover{
 transform:translateY(-1px);
}

.modal-error{
 background:rgba(244,67,54,0.1);
 border:1px solid var(--error);
 color:var(--error);
 padding:10px;
 border-radius:8px;
 margin-bottom:16px;
 font-size:14px;
 text-align:center;
}

@keyframes fadeIn{
 from{opacity:0}
 to{opacity:1}
}

@keyframes slideUp{
 from{
  transform:translateY(30px);
  opacity:0;
 }
 to{
  transform:translateY(0);
  opacity:1;
 }
}

/* ===== BAN SYSTEM ===== */
.ban-message{
 text-align:center;
 padding:20px;
 background:#2a1a1a;
 border-radius:12px;
 border:1px solid #ff4444;
 max-width:300px;
 margin-bottom:20px;
}

.ban-message h3{
 color:#ff4444;
 margin:0 0 10px 0;
}

.ban-message p{
 margin:10px 0;
 font-size:14px;
 color:#ffcccc;
}

.ban-message button{
 margin-top:10px;
 padding:8px 16px;
 background:#ff4444;
 border:none;
 border-radius:6px;
 color:white;
 cursor:pointer;
 font-weight:bold;
}

.banned-user .bubble{
 background:#3a1a1a;
 border-left:3px solid #ff4444;
 opacity:0.7;
}

/* ===== APP ===== */
.app{
 width:min(900px,100%);
 height:min(780px,100vh);
 display:flex;
 flex-direction:column;
 background:var(--card);
 border-radius:18px;
 overflow:hidden;
 opacity:0;
 transition:.4s;
}
.app.visible{opacity:1}

/* ===== HEADER ===== */
.top{
 display:flex;
 align-items:center;
 gap:10px;
 padding:6px 12px;
 height:48px;
 background:linear-gradient(90deg,var(--orange),var(--orange-2));
 color:#111;
}

.top h1{
 margin:0;
 font-size:16px;
 line-height:1;
}

.logo img{
 width:28px;
 height:28px;
 object-fit:contain;
}

.user-info{
 margin-left:auto;
 font-size:14px;
 font-weight:600;
 background:rgba(0,0,0,0.2);
 padding:4px 12px;
 border-radius:20px;
}

/* ===== FEED ===== */
.feed{
 flex:1;
 overflow:auto;
 padding:14px;
 background:#15161a;
}

.msg{
 display:flex;
 gap:10px;
 margin:6px 0;
 max-width:78%;
}

.msg.me{
 margin-left:auto;
 flex-direction:row-reverse;
}

.avatar{
 min-width:34px;
 height:34px;
 border-radius:50%;
 background:#2b2d33;
 display:grid;
 place-items:center;
 font-weight:700;
}

.bubble{
 background:var(--mine);
 padding:10px 12px;
 border-radius:16px;
 box-shadow:0 3px 10px #0006;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 word-break:break-word;
}

.bubble a{
 color:#ffae5d;
 text-decoration:underline;
}

.meta{
 font-size:11px;
 color:var(--muted);
 margin-top:4px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}

.timestamp{
 font-size:10px;
 opacity:0.7;
}

/* ===== INPUT ===== */
.input{
 display:flex;
 gap:6px;
 padding:10px;
 background:#101114;
 position:relative;
}

textarea{
 flex:1;
 height:44px;
 border-radius:10px;
 border:1px solid #2a2c32;
 background:#15171c;
 color:#fff;
 padding:10px;
 resize:none;
 font-family:system-ui;
}

button{
 border:0;
 border-radius:10px;
 cursor:pointer;
 transition:transform 0.1s;
}

button:hover{
 transform:scale(1.02);
}

.send{
 background:linear-gradient(90deg,var(--orange),var(--orange-2));
 font-weight:700;
 padding:0 14px;
}

.tool{
 width:40px;
 background:#1f2126;
 color:#fff;
}

/* ===== EMOJIS ===== */
.emoji-panel{
 position:absolute;
 bottom:70px;
 left:10px;
 background:#1c1e22;
 padding:10px;
 border-radius:12px;
 display:none;
 flex-direction:column;
 gap:8px;
 width:240px;
 max-height:260px;
 overflow-y:auto;
 box-shadow:0 10px 20px #0008;
 z-index:100;
}

.emoji-grid{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
}

.emoji-category{
 font-size:12px;
 color:#aaa;
 margin:6px 0 2px;
}
 
.emoji-panel span{
 cursor:pointer;
 font-size:20px;
 transition:transform 0.1s;
}

.emoji-panel span:hover{
 transform:scale(1.2);
}

/* ===== NOTIFICAÇÃO ===== */
.notification{
 position:fixed;
 top:20px;
 right:20px;
 background:linear-gradient(135deg, var(--orange), var(--orange-2));
 color:#111;
 padding:12px 20px;
 border-radius:12px;
 box-shadow:0 5px 20px rgba(0,0,0,0.3);
 display:flex;
 align-items:center;
 gap:12px;
 z-index:1000;
 animation: slideIn 0.3s ease-out;
 cursor:pointer;
 font-weight:600;
 min-width:250px;
 backdrop-filter:blur(10px);
}

.notification-content{
 display:flex;
 flex-direction:column;
 gap:4px;
}

.notification-user{
 font-size:14px;
 font-weight:bold;
}

.notification-preview{
 font-size:12px;
 opacity:0.9;
}

.notification-time{
 font-size:10px;
 opacity:0.8;
}

@keyframes slideIn{
 from{
  transform:translateX(100%);
  opacity:0;
 }
 to{
  transform:translateX(0);
  opacity:1;
 }
}

@keyframes slideOut{
 to{
  transform:translateX(100%);
  opacity:0;
 }
}

/* ===== TOAST ===== */
.toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 padding:12px 24px;
 border-radius:12px;
 z-index:1000;
 animation:slideIn 0.3s ease-out;
 font-size:14px;
 font-weight:500;
 box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.toast-success{
 background:linear-gradient(135deg, var(--success), #45a049);
 color:white;
}

.toast-error{
 background:linear-gradient(135deg, var(--error), #d32f2f);
 color:white;
}

.toast-info{
 background:linear-gradient(135deg, var(--orange), var(--orange-2));
 color:#111;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-track{
  background:#101114;
  border-radius:10px;
}

::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--orange),var(--orange-2));
  border-radius:10px;
  border:2px solid #101114;
}

::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(180deg,#ff8f26,#ffa347);
}

*{
  scrollbar-width:thin;
  scrollbar-color: var(--orange) #101114;
}

@media(max-width:560px){
 .avatar{display:none}
 .msg{max-width:90%}
 .notification{min-width:200px; right:10px; top:10px;}
 .modal{padding:24px; margin:16px;}
 .modal h2{font-size:24px;}
}
</style>
</head>

<body>

<div class="app" id="app">
<div class="top">
<div class="logo">
<img src="files/icon/Tfavicon.png" alt="logo">
</div>
<h1>taboi - chat v3</h1>
<div class="user-info" id="userInfo"></div>
</div>

<div id="feed" class="feed"></div>

<div class="input">
<button class="tool" id="emojiBtn">😀</button>
<button class="tool" id="linkBtn">🔗</button>
<textarea id="text" placeholder="Digite sua mensagem..."></textarea>
<button class="send" id="sendBtn">Enviar</button>

<div class="emoji-panel" id="emojiPanel">
<div class="emoji-grid" id="emojiGrid"></div>
</div>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import{getFirestore,collection,addDoc,serverTimestamp,query,orderBy,onSnapshot,limit}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyD6qPIIX4i8n0e7mm31y2D2Pb1B26NogGM",
  authDomain: "taboi-v2.firebaseapp.com",
  projectId: "taboi-v2",
  storageBucket: "taboi-v2.firebasestorage.app",
  messagingSenderId: "774936620311",
  appId: "1:774936620311:web:f6440002476c7cd9c2db52"
};

const appFB=initializeApp(firebaseConfig);
const db=getFirestore(appFB);
const MESSAGES=collection(db,"taboi_messages");

/* ACCOUNTS DATA */
let accountsData = null;
let currentUser = null;

/* ELEMENTOS */
const feed=document.getElementById("feed");
const text=document.getElementById("text");
const userInfoSpan = document.getElementById("userInfo");
let lastProcessedMessages = new Set();
let notificationPermission = false;
let unreadCount = 0;
let originalTitle = document.title;

/* ===== SISTEMA DE BANIMENTO ===== */
// Lista de usuários banidos (adicione quantos quiser aqui)
const BANNED_USERS = ['lucca', 'lukka', 'luquinhas', 'luquinha'];

// Função para verificar se um usuário está banido
function isUserBanned(username) {
  if (!username) return false;
  return BANNED_USERS.some(banned => 
    username.toLowerCase() === banned.toLowerCase()
  );
}

// Função para mostrar mensagem de banimento no modal
function showBanModal(bannedUser) {
  const modalOverlay = document.createElement('div');
  modalOverlay.className = 'modal-overlay';
  
  modalOverlay.innerHTML = `
    <div class="modal">
      <h2>⛔ ACESSO BLOQUEADO</h2>
      <div style="background:rgba(244,67,54,0.1); border:1px solid #f44336; border-radius:12px; padding:16px; margin-bottom:20px;">
        <p style="color:#ff8888; margin:0; text-align:center;">
          O usuário <strong>${bannedUser}</strong> foi permanentemente banido deste chat.
        </p>
        <p style="color:#ff8888; margin:10px 0 0 0; font-size:12px; text-align:center;">
          Motivo: Violação das regras da comunidade.
        </p>
      </div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-primary" id="banConfirmBtn">Entendi</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modalOverlay);
  
  const confirmBtn = modalOverlay.querySelector('#banConfirmBtn');
  confirmBtn.onclick = () => {
    modalOverlay.remove();
    // Limpar qualquer dado do usuário banido
    localStorage.removeItem('taboi_user');
    localStorage.removeItem('taboi_code');
    currentUser = null;
    document.getElementById('app').classList.remove('visible');
    showLoginModal();
  };
}

// Função para verificar e aplicar banimento
function checkAndApplyBan() {
  if (currentUser && isUserBanned(currentUser)) {
    localStorage.removeItem('taboi_user');
    localStorage.removeItem('taboi_code');
    showBanModal(currentUser);
    currentUser = null;
    document.getElementById('app').classList.remove('visible');
    return true;
  }
  return false;
}

// Verificação periódica anti-trapaça (a cada 5 segundos)
setInterval(() => {
  if (currentUser && isUserBanned(currentUser)) {
    localStorage.removeItem('taboi_user');
    localStorage.removeItem('taboi_code');
    showBanModal(currentUser);
    currentUser = null;
    document.getElementById('app').classList.remove('visible');
    showLoginModal();
  }
}, 5000);

/* ===== MODAL DE LOGIN ===== */
function showLoginModal() {
 const modalOverlay = document.createElement('div');
 modalOverlay.className = 'modal-overlay';
 
 modalOverlay.innerHTML = `
  <div class="modal">
   <h2>🔐 Login</h2>
   <p>Digite o código de acesso fornecido pelo administrador para entrar no chat.</p>
   <input type="text" class="modal-input" id="loginCode" placeholder="Código de acesso" autocomplete="off">
   <div id="loginError" class="modal-error" style="display:none;"></div>
   <div class="modal-buttons">
    <button class="modal-btn modal-btn-primary" id="loginBtn">Entrar</button>
   </div>
  </div>
 `;
 
 document.body.appendChild(modalOverlay);
 
 const input = modalOverlay.querySelector('#loginCode');
 const loginBtn = modalOverlay.querySelector('#loginBtn');
 const errorDiv = modalOverlay.querySelector('#loginError');
 
 input.focus();
 
 function attemptLogin() {
  const code = input.value.trim().toUpperCase();
  if (!code) {
   showError('Por favor, digite o código de acesso');
   return;
  }
  
  // Buscar usuário pelo código
  const user = accountsData.users.find(u => u.code === code);
  
  if (user) {
   // VERIFICA BANIMENTO ANTES DE PERMITIR LOGIN
   if (isUserBanned(user.name)) {
    errorDiv.textContent = '❌ Esta conta foi permanentemente banida do sistema!';
    errorDiv.style.display = 'block';
    input.style.borderColor = '#f44336';
    setTimeout(() => {
     modalOverlay.remove();
     showBanModal(user.name);
    }, 2000);
    return;
   }
   
   currentUser = user.name;
   localStorage.setItem('taboi_user', currentUser);
   localStorage.setItem('taboi_code', code);
   modalOverlay.remove();
   showApp();
   showToast(`Bem-vindo, ${currentUser}! ✅`, 'success');
   setTimeout(() => {
    requestNotificationPermission();
   }, 500);
  } else {
   showError('Código inválido! Verifique com o administrador.');
  }
 }
 
 function showError(message) {
  errorDiv.textContent = message;
  errorDiv.style.display = 'block';
  input.style.borderColor = '#f44336';
  setTimeout(() => {
   errorDiv.style.display = 'none';
   input.style.borderColor = '#2a2c32';
  }, 3000);
 }
 
 loginBtn.onclick = attemptLogin;
 
 input.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
   attemptLogin();
  }
 });
}

/* ===== MODAL DE PERMISSÃO DE NOTIFICAÇÃO ===== */
function showNotificationPermissionModal() {
 return new Promise((resolve) => {
  const modalOverlay = document.createElement('div');
  modalOverlay.className = 'modal-overlay';
  
  modalOverlay.innerHTML = `
   <div class="modal">
    <h2>🔔 Ativar Notificações</h2>
    <p>Receba alertas em tempo real quando alguém enviar uma nova mensagem no chat. Você pode ativar ou desativar isso a qualquer momento nas configurações do navegador.</p>
    <div class="modal-buttons">
     <button class="modal-btn modal-btn-secondary" id="notifNo">Não, obrigado</button>
     <button class="modal-btn modal-btn-primary" id="notifYes">Sim, ativar</button>
    </div>
   </div>
  `;
  
  document.body.appendChild(modalOverlay);
  
  const yesBtn = modalOverlay.querySelector('#notifYes');
  const noBtn = modalOverlay.querySelector('#notifNo');
  
  yesBtn.onclick = async () => {
   modalOverlay.remove();
   const permission = await Notification.requestPermission();
   const granted = permission === 'granted';
   if (granted) {
    notificationPermission = true;
    showToast('Notificações ativadas! 🔔', 'success');
   } else {
    showToast('Notificações não permitidas', 'info');
   }
   resolve(granted);
  };
  
  noBtn.onclick = () => {
   modalOverlay.remove();
   notificationPermission = false;
   showToast('Notificações desativadas', 'info');
   resolve(false);
  };
 });
}

/* ===== SOLICITAR PERMISSÃO COM MODAL ===== */
async function requestNotificationPermission() {
 if (!("Notification" in window)) {
  console.log("Este navegador não suporta notificações");
  return;
 }
 
 if (Notification.permission === "granted") {
  notificationPermission = true;
 } else if (Notification.permission !== "denied") {
  await showNotificationPermissionModal();
 } else {
  notificationPermission = false;
 }
}

/* ===== EXIBIR APP ===== */
function showApp() {
 document.getElementById('app').classList.add('visible');
 updateUserInfo();
}

function updateUserInfo() {
 if (currentUser) {
  userInfoSpan.textContent = `👤 ${currentUser}`;
 }
}

/* ===== FUNÇÃO PARA MOSTRAR NOTIFICAÇÃO ===== */
function showNotification(user, message, timestamp){
 if (!notificationPermission && Notification.permission !== "granted") return;
 if (user === currentUser) return;
 // Não notifica mensagens de usuários banidos
 if (isUserBanned(user)) return;
 
 if (document.hidden) {
  const notification = new Notification(`📩 Nova mensagem de ${user}`, {
   body: message.length > 60 ? message.substring(0, 60) + "..." : message,
   icon: "files/icon/Tfavicon.png",
   silent: false,
  });
  
  notification.onclick = () => {
   window.focus();
   notification.close();
  };
  
  playNotificationSound();
  updateUnreadCount(1);
 } else {
  showCustomNotification(user, message, timestamp);
 }
}

function playNotificationSound() {
 try {
  const audio = new Audio("data:audio/wav;base64,U3RlYWx0aCBub3RpZmljYXRpb24gc291bmQ=");
  audio.volume = 0.3;
  audio.play().catch(e => console.log("Áudio não pôde ser reproduzido"));
 } catch(e) {
  console.log("Som não disponível");
 }
}

function showCustomNotification(user, message, timestamp){
 const oldNotifs = document.querySelectorAll(".notification");
 oldNotifs.forEach(notif => {
  notif.style.animation = "slideOut 0.3s ease-out";
  setTimeout(() => notif.remove(), 300);
 });
 
 const notif = document.createElement("div");
 notif.className = "notification";
 const preview = message.length > 50 ? message.substring(0, 50) + "..." : message;
 
 notif.innerHTML = `
  <div class="notification-content">
   <div class="notification-user">💬 ${user}</div>
   <div class="notification-preview">${escapeHtml(preview)}</div>
   <div class="notification-time">${timestamp || "agora"}</div>
  </div>
 `;
 
 notif.onclick = () => {
  notif.style.animation = "slideOut 0.3s ease-out";
  setTimeout(() => notif.remove(), 300);
  feed.scrollTop = feed.scrollHeight;
 };
 
 document.body.appendChild(notif);
 
 setTimeout(() => {
  if(notif.parentNode){
   notif.style.animation = "slideOut 0.3s ease-out";
   setTimeout(() => notif.remove(), 300);
  }
 }, 5000);
}

function updateUnreadCount(increment) {
 if (document.hidden) {
  unreadCount += increment;
  document.title = `(${unreadCount}) ${originalTitle}`;
 }
}

/* ===== ESCAPE HTML ===== */
function escapeHtml(text){
 const div = document.createElement("div");
 div.textContent = text;
 return div.innerHTML;
}

/* ===== TOAST ===== */
function showToast(message, type = "info"){
 const toast = document.createElement("div");
 toast.className = `toast toast-${type}`;
 toast.textContent = message;
 document.body.appendChild(toast);
 setTimeout(() => {
  toast.style.animation = "slideOut 0.3s ease-out";
  setTimeout(() => toast.remove(), 300);
 }, 3000);
}

/* ===== FORMATAÇÃO DE HORÁRIO ===== */
function formatTimestamp(timestamp){
 if(!timestamp) return "agora";
 
 let date;
 if(timestamp.toDate){
  date = timestamp.toDate();
 } else if(timestamp.seconds){
  date = new Date(timestamp.seconds * 1000);
 } else {
  date = new Date(timestamp);
 }
 
 const now = new Date();
 const diff = now - date;
 const diffMinutes = Math.floor(diff / 60000);
 const diffHours = Math.floor(diff / 3600000);
 const diffDays = Math.floor(diff / 86400000);
 
 if(diffDays === 0){
  if(diffMinutes < 1) return "agora mesmo";
  if(diffMinutes < 60) return `há ${diffMinutes} min`;
  return date.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
 }
 
 if(diffDays === 1){
  return `ontem às ${date.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"})}`;
 }
 
 return date.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"}) + 
        " às " + date.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
}

/* ===== EMOJIS ===== */
const emojiCategories = {
  "😀 Carinhas": ["😀","😂","😎","😍","🥶","😱","😡","😭","😄","😁","😆","😅","🤣","😊"],
  "👏 Gestos": ["👍","👏","❤️","👊","✌️","🤘","🤙","👌","🤝"],
  "🎉 Objetos": ["🔥","⭐","✨","🎉","🎁","🎈","🎂","💣","💬"],

function linkify(t){
 return t.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

/* ===== LISTENER MENSAGENS ===== */
const q = query(MESSAGES, orderBy("ts","asc"), limit(200));

onSnapshot(q, (snap) => {
 const newMessages = [];
 
 snap.docChanges().forEach(change => {
  if (change.type === "added") {
   const msgData = change.doc.data();
   const msgId = change.doc.id;
   
   if (!lastProcessedMessages.has(msgId)) {
    lastProcessedMessages.add(msgId);
    newMessages.push({ id: msgId, data: msgData });
    
    if (lastProcessedMessages.size > 300) {
     const toDelete = [...lastProcessedMessages][0];
     lastProcessedMessages.delete(toDelete);
    }
   }
  }
 });
 
 feed.innerHTML = "";
 snap.forEach(doc => {
  const m = doc.data();
  if(m.user && m.body) {
   feed.appendChild(messageEl(m));
  }
 });
 feed.scrollTop = feed.scrollHeight;
 
 newMessages.forEach(({ data: m }) => {
  if (m.user && m.user !== currentUser && !isUserBanned(m.user)) {
   const timestampFormatted = formatTimestamp(m.ts);
   showNotification(m.user, m.body, timestampFormatted);
  }
 });
});

/* ===== FUNÇÃO PARA DESCRIPTOGRAFAR ===== */
async function descriptografarAccounts(encryptedData, senhaMestra) {
    try {
        // Verificar formato
        if (!encryptedData || !encryptedData.data) {
            throw new Error('Formato inválido');
        }
        
        // Converter base64 para bytes
        const encryptedBytes = Uint8Array.from(atob(encryptedData.data), c => c.charCodeAt(0));
        
        // Extrair salt (16 primeiros bytes), iv (próximos 12), dados (restante)
        const salt = encryptedBytes.slice(0, 16);
        const iv = encryptedBytes.slice(16, 28);
        const data = encryptedBytes.slice(28);
        
        // Derivar chave da senha
        const encoder = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            'raw',
            encoder.encode(senhaMestra),
            'PBKDF2',
            false,
            ['deriveKey']
        );
        
        const key = await crypto.subtle.deriveKey(
            {
                name: 'PBKDF2',
                salt: salt,
                iterations: 100000,
                hash: 'SHA-256'
            },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt']
        );
        
        // Descriptografar
        const decrypted = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: iv },
            key,
            data
        );
        
        // Converter para JSON
        const decoder = new TextDecoder();
        const result = JSON.parse(decoder.decode(decrypted));
        
        // Retornar array de usuários
        if (result.users && Array.isArray(result.users)) {
            return result.users;
        }
        if (Array.isArray(result)) {
            return result;
        }
        
        return null;
        
    } catch (error) {
        console.error('Erro na descriptografia:', error);
        return null;
    }
}
