<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>taboi - chat</title>
<link rel="icon" href="files/icon/favicon.ico">

<style>
:root{
  --orange:#ff7a00;
  --orange-2:#ff8f26;
  --bg:#0f0f10;
  --card:#17181b;
  --text:#eaeaea;
  --muted:#a8a8a8;
  --mine:#23252a;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#111,#0b0b0b);
  font-family:system-ui,Segoe UI,Roboto,Ubuntu,sans-serif;
  color:var(--text);
  height:100vh;
  display:grid;
  place-items:center;
}

/* Splash */
.splash{
  position:fixed;
  inset:0;
  background:#0f0f10;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  z-index:200;
}

.splash-logo{
  font-size:42px;
  font-weight:800;
  background:linear-gradient(90deg,var(--orange),var(--orange-2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.progress{
  width:220px;
  height:8px;
  background:#222;
  border-radius:6px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--orange),var(--orange-2));
  transition:width .3s;
}

.splash-footer{
  position:absolute;
  bottom:10px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
  font-size:12px;
  color:var(--muted);
}

.app{
  width:min(900px,100%);
  height:min(780px,100vh);
  display:flex;
  flex-direction:column;
  background:var(--card);
  border:1px solid #222;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  opacity:0;
  transition:opacity .5s;
}

.app.visible{opacity:1}

.top{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  background:linear-gradient(90deg,var(--orange),var(--orange-2));
  color:#111;
}

.logo{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#1113;
  display:grid;
  place-items:center;
  font-weight:700;
}

.feed{
  flex:1;
  overflow:auto;
  padding:14px;
  background:repeating-linear-gradient(135deg,#15161a 0 20px,#141519 20px 40px);
}

.day{
  position:sticky;
  top:8px;
  z-index:2;
  width:max-content;
  margin:12px auto 8px;
  padding:4px 10px;
  border-radius:999px;
  background:#0008;
  font-size:12px;
}

.msg{
  display:flex;
  gap:10px;
  margin:6px 0;
  max-width:78%;
}

.msg.me{
  margin-left:auto;
  flex-direction:row-reverse;
}

.avatar{
  min-width:34px;
  height:34px;
  border-radius:50%;
  background:#2b2d33;
  display:grid;
  place-items:center;
  font-weight:700;
}

.bubble{
  background:var(--mine);
  padding:10px 12px;
  border-radius:16px 16px 16px 6px;
  box-shadow:0 3px 10px #0006;
  white-space:pre-wrap;
}

.msg.me .bubble{
  background:linear-gradient(180deg,#2b2d33,#23252a);
  border-radius:16px 16px 6px 16px;
  border:1px solid #2f3239;
}

.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.input{
  display:flex;
  gap:8px;
  padding:10px;
  background:#101114;
  border-top:1px solid #1e1f24;
}

textarea{
  flex:1;
  resize:none;
  height:44px;
  border-radius:12px;
  border:1px solid #2a2c32;
  background:#15171c;
  color:#fff;
  padding:10px 12px;
  outline:none;
}

.send{
  min-width:54px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,var(--orange),var(--orange-2));
  font-weight:700;
  cursor:pointer;
}

.typing{
  padding:0 14px 8px;
  color:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>

<!-- Splash -->
<div class="splash" id="splash">
  <div class="splash-logo">taboi - chat</div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="splash-footer">
    <span>- Desenvolvedor: Vicente Cisotto Bajay</span>
    <span>v1.0</span>
  </div>
</div>

<div class="app" id="app">
  <div class="top">
    <div class="logo">💬</div>
    <h1>taboi - chat</h1>
  </div>

  <div id="feed" class="feed"></div>
  <div id="typing" class="typing" style="display:none;">alguém está digitando…</div>

  <div class="input">
    <textarea id="text" placeholder="mensagem"></textarea>
    <button class="send" id="sendBtn">Enviar</button>
  </div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {
  getFirestore,collection,addDoc,
  serverTimestamp,query,orderBy,
  onSnapshot,limit,doc,setDoc
}
from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

/* Firebase */
const firebaseConfig={
  apiKey:"AIzaSyAGFTj3yVsVJf0J-_FLP3TdP-S3XkQMGnw",
  authDomain:"taboi-chat.firebaseapp.com",
  projectId:"taboi-chat",
  storageBucket:"taboi-chat.firebasestorage.app",
  messagingSenderId:"907432211068",
  appId:"1:907432211068:web:899b31e0ea69d5b9590ff9"
};

const appFB=initializeApp(firebaseConfig);
const db=getFirestore(appFB);

const MESSAGES=collection(db,"taboi_messages");
const TYPING=doc(db,"taboi_meta/typing");

/* ===== usuário anônimo ===== */

function randomName(){
  const nomes=["Pixel","Nova","Echo","Byte","Shadow","Lunar","Cometa","Zeta"];
  return nomes[Math.floor(Math.random()*nomes.length)]
        +"#"+Math.floor(Math.random()*9999);
}

let anon=sessionStorage.getItem("taboi_anon");
if(!anon){
  anon=randomName();
  sessionStorage.setItem("taboi_anon",anon);
}

function getUser(){return anon}

/* UI */
const feed=document.getElementById("feed");
const text=document.getElementById("text");
const sendBtn=document.getElementById("sendBtn");
const typingEl=document.getElementById("typing");

/* typing */
let typingTimer=null;

async function setTyping(state){
  await setDoc(TYPING,{
    typing:!!state,
    at:Date.now(),
    user:getUser()
  });
}

text.addEventListener("input",()=>{
  setTyping(true);
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>setTyping(false),1000);
});

text.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
});

sendBtn.onclick=send;

/* enviar mensagem */
async function send(){
  let body=text.value.trim();
  if(!body) return;

  text.value="";

  await addDoc(MESSAGES,{
    body,
    user:getUser(),
    ts:serverTimestamp()
  });

  setTyping(false);
}

/* typing indicator */
onSnapshot(TYPING,(snap)=>{
  const d=snap.data();
  const show=d?.typing && d.user!==getUser()
      && Date.now()-d.at<2000;
  typingEl.style.display=show?"block":"none";
});

/* mensagens */
const q=query(MESSAGES,orderBy("ts","asc"),limit(200));

onSnapshot(q,(snap)=>{
  feed.innerHTML="";
  snap.forEach(doc=>{
    const m=doc.data();
    feed.appendChild(messageEl(m));
  });
  feed.scrollTop=feed.scrollHeight;
});

function initials(name){
  return name.split("#")[0][0];
}

function hhmm(d){
  return d.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function messageEl(m){
  const mine=m.user===getUser();

  const wrap=document.createElement("div");
  wrap.className="msg"+(mine?" me":"");

  const av=document.createElement("div");
  av.className="avatar";
  av.textContent=initials(m.user);

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=m.body;

  const meta=document.createElement("div");
  meta.className="meta";
  meta.textContent=m.user+" • "+hhmm(new Date());

  const right=document.createElement("div");
  right.appendChild(bubble);
  right.appendChild(meta);

  wrap.appendChild(av);
  wrap.appendChild(right);

  return wrap;
}

/* splash */
const splash=document.getElementById("splash");
const appDiv=document.getElementById("app");
const bar=document.getElementById("progressBar");

let prog=0;
function step(){
  prog+=Math.random()*4+1;
  if(prog>100) prog=100;
  bar.style.width=prog+"%";

  if(prog<100){
    setTimeout(step,300);
  }else{
    setTimeout(()=>{
      splash.style.display="none";
      appDiv.classList.add("visible");
    },400);
  }
}
step();

</script>
</body>
</html>
